name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '37 1 * * *' # 04:37 Minsk; non-round minute reduces dropped/delayed schedules
  workflow_dispatch:
    inputs:
      environment:
        description: Select one NextDNS environment or ALL
        type: choice
        required: true
        default: DNS
        options: [DNS, DNS_WIFE, DNS_DIRECTOR, DNS_PV, ALL]
      confirm_write:
        description: Confirm running original upstream code with LIVE NextDNS writes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON((github.event_name == 'schedule' || inputs.environment == 'ALL') && '["DNS","DNS_WIFE","DNS_DIRECTOR","DNS_PV"]' || format('["{0}"]', inputs.environment)) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: nextdns-upstream-${{ matrix.environment }}
      cancel-in-progress: false

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      UPSTREAM_AUTORUN_ENABLED: ${{ vars.UPSTREAM_AUTORUN_ENABLED }}
      EVENT_NAME: ${{ github.event_name }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
      TZ: Europe/Moscow

    steps:
      - name: Guard against accidental live writes or empty sources
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == schedule && "$UPSTREAM_AUTORUN_ENABLED" != true ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "Schedule not armed for this environment: UPSTREAM_AUTORUN_ENABLED is not true." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch && "$CONFIRM_WRITE" != true ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Manual run skipped: confirm_write was not checked.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$DNS" || -z "$CLIENT_ID" || -z "$AUTH_SECRET" ]]; then
            echo 'DNS, CLIENT_ID or AUTH_SECRET is missing.' >&2
            exit 1
          fi
          if [[ -z "$BLOCK" && -z "$REDIRECT" ]]; then
            echo 'Both BLOCK and REDIRECT are empty. Refusing to run upstream removeAll().' >&2
            exit 1
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up JDK 26
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        if: steps.gate.outputs.run == 'true'
        run: mvn -B clean package

      - name: Run original upstream application (mutates NextDNS)
        if: steps.gate.outputs.run == 'true'
        run: java --enable-preview -jar target/*.jar
