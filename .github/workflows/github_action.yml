name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '37 1 * * 0-6' # Daily at 04:37 Minsk (UTC+3); re-register schedule
  workflow_dispatch:
    inputs:
      environment:
        description: Select one NextDNS environment or ALL
        type: choice
        required: true
        default: ALL
        options: [DNS, DNS_WIFE, DNS_DIRECTOR, DNS_PV, ALL]
      confirm_write:
        description: Confirm live NextDNS writes after initial migration is completed
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON((github.event_name == 'schedule' || inputs.environment == 'ALL') && '["DNS","DNS_WIFE","DNS_DIRECTOR","DNS_PV"]' || format('["{0}"]', inputs.environment)) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: nextdns-upstream-${{ matrix.environment }}
      cancel-in-progress: false

    env:
      MATRIX_ENVIRONMENT: ${{ matrix.environment }}
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: https://raw.githubusercontent.com/NixZ-lab/my-dns-config/main/hosts
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify complete one-time migration before auto-sync
        id: migrated
        run: python3 scripts/nextdns_activation.py

      - name: Determine whether this execution may mutate NextDNS
        id: live
        shell: bash
        env:
          EVENT_KIND: ${{ github.event_name }}
          EXPLICIT_CONFIRM: ${{ inputs.confirm_write }}
          MIGRATED: ${{ steps.migrated.outputs.activated }}
        run: |
          set -euo pipefail
          RUN=false
          if [[ "$EVENT_KIND" == schedule && "$MIGRATED" == true ]]; then
            RUN=true
          elif [[ "$EVENT_KIND" == workflow_dispatch && "$MIGRATED" == true &&
                  "$EXPLICIT_CONFIRM" == true ]]; then
            RUN=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [[ "$RUN" == false ]]; then
            echo "Read-only check: initial migration not completed or manual live-write confirmation absent." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read-only NextDNS capacity audit before activation
        if: steps.live.outputs.run != 'true'
        env:
          EVENT_NAME: workflow_dispatch
          CONFIRM_WRITE: 'false'
        run: python3 scripts/audit_nextdns_capacity.py

      - name: Pin latest hosts source to an immutable commit
        if: steps.live.outputs.run == 'true'
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL --retry 3 https://api.github.com/repos/NixZ-lab/my-dns-config/commits/main |
            python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "hosts_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create fresh encrypted profile backup before any write
        if: steps.live.outputs.run == 'true'
        run: |
          python3 scripts/migrate_nextdns.py backup \
            --ref "${{ steps.pin.outputs.hosts_sha }}" \
            --file backup/backup.bin

      - name: Preserve encrypted backup in GitHub Actions
        if: steps.live.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nextdns-sync-${{ github.run_id }}-${{ matrix.environment }}
          path: backup/backup.bin
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Reconcile and verify NextDNS rewrites
        if: steps.live.outputs.run == 'true'
        env:
          MIGRATE_CONFIRM: REPLACE_ALL_REWRITES
        run: |
          python3 scripts/migrate_nextdns.py apply \
            --ref "${{ steps.pin.outputs.hosts_sha }}" \
            --file backup/backup.bin
