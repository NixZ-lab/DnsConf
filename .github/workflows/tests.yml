name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Test read-only NextDNS capacity audit
        run: python3 -m unittest scripts.test_audit_nextdns_capacity

      - name: Test backup/encryption and full NextDNS migration offline
        run: python3 -m unittest scripts.test_migrate_nextdns

      - name: Test successful-migration gate for scheduled sync
        run: python3 -m unittest scripts.test_nextdns_activation

      - name: Validate workflow expressions and syntax (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Run tests
        run: mvn -B test
